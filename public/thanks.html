<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Заявка отправлена — Namib Passage</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌅</text></svg>">
<style>
  :root{
    --color-carbon-ink:#222222;
    --color-paper-white:#ffffff;
    --color-newsprint-gray:#f7f7f7;
    --color-fog:#6a6a6a;
    --line:rgba(34,34,34,.13);
    --font-sans:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    --radius-buttons:8px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--color-newsprint-gray);color:var(--color-carbon-ink);font-family:var(--font-sans);font-weight:500;font-size:18px;line-height:1.56;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px;}
  .card{background:var(--color-paper-white);border:1px solid var(--line);border-radius:16px;padding:56px 40px;max-width:520px;text-align:center;}
  .icon{font-size:40px;margin-bottom:20px;}
  h1{font-size:clamp(24px,3.4vw,32px);line-height:1.2;letter-spacing:-.02em;margin:0 0 16px;}
  p{color:var(--color-fog);margin:0 0 28px;}
  a.home{display:inline-flex;align-items:center;gap:8px;font-weight:500;font-size:16px;color:var(--color-paper-white);background:var(--color-carbon-ink);padding:14px 24px;border-radius:var(--radius-buttons);text-decoration:none;}
</style>
</head>
<body>
  <div class="card">
    <div class="icon">✓</div>
    <h1>Заявка отправлена</h1>
    <p>Спасибо, мы получили вашу заявку и свяжемся с вами в течение 24 часов.</p>
    <a class="home" href="/">← Вернуться на сайт</a>
  </div>
</body>
</html>
